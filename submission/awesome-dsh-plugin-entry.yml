# Template for the awesome-dsh-plugin entry.
#
# Replace OWNER with your GitHub username or organization, then copy the file to
# `data/plugins/OWNER__dsh-plugin-quick-invoke.yml` in a fork of
# https://github.com/awesome-dsh-plugin/awesome-dsh-plugin and open a pull
# request. Running `node scripts/write-submission.mjs OWNER` generates the
# final file (with the correct filename) under submission/data/plugins/.
url: https://github.com/OWNER/dsh-plugin-quick-invoke
name: OWNER/dsh-plugin-quick-invoke
category: ui
description:
  en: 'Adds an installed-plugin picker beside the composer: drag a plugin name into the prompt at the drop point, open a draggable plugin rail in the right sidebar by double-clicking the entry, and choose which plugins (and remarks) appear in Settings.'
  zh: '在输入框旁增加已安装插件选择器：把插件名拖到提示词的落点插入，双击入口在右侧边栏打开可拖动插件栏，并可在设置中选择显示哪些插件、填写备注。'
